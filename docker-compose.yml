version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - db
    environment:
      - VITE_API_URL=http://localhost:8080 # Update this when you build your backend API

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount your existing migrations to initialize the DB automatically
      - ./supabase/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data: